<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <main>
    <p id="board-instructions" class="visually-hidden">
      Use the arrow keys to move between editable cells. Enter a digit from 1 to 9 or clear a cell.
    </p>
    <div
      id="sudoku-board"
      role="grid"
      aria-label="Sudoku puzzle"
      aria-describedby="board-instructions"
    ></div>
  </main>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <button id="theme-toggle" type="button" aria-pressed="false">Theme: Light</button>
    <span id="timer" role="status" aria-live="polite">Time: 00:00</span>
    <span id="hint-count" aria-live="polite">Hints used: 0</span>
    <span id="message"></span>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Leaderboard</h2>
    <div class="leaderboard-table-wrap">
      <table>
        <caption class="visually-hidden">Top 10 fastest completed Sudoku games</caption>
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Player</th>
            <th scope="col">Time</th>
            <th scope="col">Difficulty</th>
            <th scope="col">Hints</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
    <p id="leaderboard-empty">Complete a puzzle to add your time.</p>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
