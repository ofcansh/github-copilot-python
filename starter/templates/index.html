<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <main>
    <p id="board-instructions" class="visually-hidden">
      Use the arrow keys to move between editable cells. Enter a digit from 1 to 9 or clear a cell.
    </p>
    <div
      id="sudoku-board"
      role="grid"
      aria-label="Sudoku puzzle"
      aria-describedby="board-instructions"
    ></div>
  </main>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="timer" role="status" aria-live="polite">Time: 00:00</span>
    <span id="hint-count" aria-live="polite">Hints used: 0</span>
    <span id="message"></span>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
